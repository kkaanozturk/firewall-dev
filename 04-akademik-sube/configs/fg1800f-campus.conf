# Path: 04-akademik-sube/configs/fg1800f-campus.conf
# Kalkan Bilişim - Akademik Şube (10.000 Öğrenci + 320 Hoca + 310 Kadro) Omurga Güvenlik Duvarı Konfigürasyonu
# Cihaz: Fortinet FortiGate 1800F (Active-Passive HA, NP7 Hardware Offload) | WAN: 20 Gbps ULAKNET + 10 Gbps ISP (30 Gbps)

config system global
    set hostname "AKA-CAMPUS-FW01"
    set timezone 27
    set admin-sport 8443
    set admin-ssh-port 2222
    set admin-ssh-v1 disable
    set strong-crypto enable
    set ssl-min-proto-version TLSv1-2
    set tcp-halfclose-timer 30
    set udp-idle-timer 60
end

# Active-Passive HA (2x40G QSFP+ Session Sync - 12 Milyon Oturum Tablosu)
config system ha
    set group-id 100
    set group-name "AKA-CAMPUS-1800F-HA"
    set mode a-p
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set session-pickup-connectionless enable
    set override disable
    set priority 200
end

# 30 Gbps SD-WAN (20 Gbps ULAKNET + 10 Gbps Ticari ISP) ve 2x40G LACP Kampüs Omurgası
config system interface
    edit "port25"
        set alias "WAN1_ULAKNET_20Gbps"
        set ip 193.140.210.2 255.255.255.252
    next
    edit "port26"
        set alias "WAN2_COMMERCIAL_ISP_10Gbps"
        set ip 198.51.100.130 255.255.255.252
    next
    edit "agg_campus_core"
        set type aggregate
        set member "port37" "port38"
        set lacp-mode active
        set alias "LACP_2x40G_CAMPUS_CORE"
    next
    edit "vlan10_noc"
        set interface "agg_campus_core"
        set vlanid 10
        set ip 10.40.10.1 255.255.255.0
        set allowaccess https ssh snmp
    next
    edit "vlan20_admin"
        set interface "agg_campus_core"
        set vlanid 20
        set ip 10.40.20.1 255.255.254.0
    next
    edit "vlan25_faculty"
        set interface "agg_campus_core"
        set vlanid 25
        set ip 10.40.24.1 255.255.252.0
    next
    edit "vlan30_swdev"
        set interface "agg_campus_core"
        set vlanid 30
        set ip 10.40.30.1 255.255.255.0
    next
    edit "vlan40_hpc"
        set interface "agg_campus_core"
        set vlanid 40
        set ip 10.40.40.1 255.255.255.0
    next
    edit "vlan50_campus_dc"
        set interface "agg_campus_core"
        set vlanid 50
        set ip 10.40.50.1 255.255.255.0
    next
    edit "vlan55_exam"
        set interface "agg_campus_core"
        set vlanid 55
        set ip 10.40.55.1 255.255.252.0
    next
    edit "vlan60_dmz_edu"
        set interface "agg_campus_core"
        set vlanid 60
        set ip 10.40.60.1 255.255.255.0
    next
    edit "vlan80_labs"
        set interface "agg_campus_core"
        set vlanid 80
        set ip 10.40.80.1 255.255.248.0
    next
    edit "vlan100_stu_wifi"
        set interface "agg_campus_core"
        set vlanid 100
        set ip 10.100.0.1 255.255.0.0
    next
    edit "vlan190_guest"
        set interface "agg_campus_core"
        set vlanid 190
        set ip 172.16.40.1 255.255.252.0
    next
end

# Öğrenci Wi-Fi Bölgesinde İstemciler Arası Trafik Engeli (Client Isolation / Intra-Zone Deny)
config system zone
    edit "ZONE_STUDENT_WIFI"
        set intrazone deny
        set interface "vlan100_stu_wifi"
    next
end

# Eduroam FreeRADIUS 802.1X RSSO (RADIUS Single Sign-On) Kimlik Eşleştirme
config user radius
    edit "FREERADIUS_EDUROAM"
        set server "10.40.50.15"
        set secret ENC 8a9f2d4b7c1e0a3f6d8b2c5e9a1f4d7b3c6e8a2f5d9b1c4e7a0f3d6b8c2e5a9f
        set rsso enable
        set rsso-radius-response enable
        set rsso-validate-request-secret enable
        set rsso-secret ENC 4e7b1c9a2f5d8e3b6c0a4f7d2e9b5c1a8f3d6e0b4c7a9f2d5e8b1c6a3f0d7e4b
        set rsso-endpoint-attribute User-Name
    next
end

# 5651 TÜBİTAK Zaman Damgalı Log Sunucusu ve İstanbul Merkez SIEM TLS Loglama
config log syslogd setting
    set status enable
    set server "10.40.50.26"
    set mode reliable
    set port 6514
    set enc-algorithm high
end

config log syslogd2 setting
    set status enable
    set server "10.10.50.25"
    set mode reliable
    set port 6514
    set enc-algorithm high
end

# Per-IP Bant Genişliği ve Oturum Sınırlayıcı (10.000 Öğrenci İçin 15 Mbps DL / 400 Max Oturum)
config firewall shaper per-ip-shaper
    edit "SHAPER_STUDENT_15M_400SES"
        set max-bandwidth 15360
        set bandwidth-unit kbps
        set max-concurrent-session 400
    next
    edit "SHAPER_LAB_30M"
        set max-bandwidth 30720
        set bandwidth-unit kbps
        set max-concurrent-session 600
    next
    edit "SHAPER_GUEST_5M"
        set max-bandwidth 5120
        set bandwidth-unit kbps
        set max-concurrent-session 150
    next
end

# NP7 Donanım Hızlandırmalı PBA CGNAT Havuzu (512 Port Blok Tahsisi)
config firewall ippool
    edit "CGNAT_POOL_STUDENTS_PBA"
        set type port-block-allocation
        set startip 193.140.210.65
        set endip 193.140.210.126
        set block-size 512
        set num-blocks-per-user 2
        set arp-reply enable
    next
end

# P2P, BitTorrent, Tor ve Kripto Madencilik Engeli
config application list
    edit "APP_CTRL_CAMPUS_STUDENT"
        set other-application-log enable
        config entries
            edit 1
                set category 2 6
                set action block
            next
            edit 2
                set application 41668
                set action block
            next
            edit 3
                set category 1 3 5 12 15
                set action pass
            next
        end
    next
end

# Kampüs Güvenlik Politikaları
config firewall policy
    edit 10
        set name "DENY-STUDENT-TO-INTERNAL-AND-HQVPN"
        set srcintf "ZONE_STUDENT_WIFI" "vlan80_labs" "vlan190_guest"
        set dstintf "vpn_ist_soc" "vlan50_campus_dc" "vlan20_admin" "vlan25_faculty" "vlan30_swdev" "vlan40_hpc"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 20
        set name "ALLOW-EXAM-HALL-ONLY-LMS-SERVER"
        set srcintf "vlan55_exam"
        set dstintf "vlan60_dmz_edu"
        set srcaddr "NET_EXAM_HALLS_10_40_55_0"
        set dstaddr "VIP_EXAM_LMS_10_40_60_50"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next
    edit 21
        set name "DENY-EXAM-HALL-ALL-INTERNET"
        set srcintf "vlan55_exam"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 25
        set name "ALLOW-STUDENT-TO-WAF-OBS-LMS"
        set srcintf "ZONE_STUDENT_WIFI" "vlan80_labs"
        set dstintf "vlan60_dmz_edu"
        set srcaddr "all"
        set dstaddr "VIP_FORTIWEB_LMS_OBS_10_40_60_10"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next
    edit 30
        set name "ALLOW-10K-STUDENTS-INTERNET-5651"
        set srcintf "ZONE_STUDENT_WIFI"
        set dstintf "port25" "port26"
        set srcaddr "NET_STUDENT_WIFI_10_100_0_0_16"
        set rsso enable
        set groups "RSSO_EDU_STUDENTS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "QUIC"
        set utm-status enable
        set av-profile "campus-av"
        set webfilter-profile "wf-academic-safe"
        set dnsfilter-profile "dns-botnet-sinkhole"
        set application-list "APP_CTRL_CAMPUS_STUDENT"
        set ips-sensor "campus-edge-ips"
        set per-ip-shaper "SHAPER_STUDENT_15M_400SES"
        set nat enable
        set ippool enable
        set poolname "CGNAT_POOL_STUDENTS_PBA"
        set logtraffic all
        set logtraffic-start enable
    next
    edit 40
        set name "ALLOW-320-FACULTY-ACADEMIC-ULAKNET"
        set srcintf "vlan25_faculty"
        set dstintf "port25" "port26" "vlan60_dmz_edu"
        set srcaddr "NET_FACULTY_10_40_24_0_22"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "DNS"
        set utm-status enable
        set av-profile "campus-av"
        set ips-sensor "campus-edge-ips"
        set nat enable
        set logtraffic all
    next
    edit 50
        set name "ALLOW-190-ADMIN-STAFF-OBS-DC"
        set srcintf "vlan20_admin"
        set dstintf "vlan50_campus_dc" "port26"
        set srcaddr "NET_ADMIN_10_40_20_0_23"
        set action accept
        set schedule "always"
        set service "HTTPS" "LDAPS" "KERBEROS" "DNS"
        set utm-status enable
        set ips-sensor "high_security"
        set nat enable
        set logtraffic all
    next
    edit 60
        set name "ALLOW-45-HPC-RND-ULAKNET-GRID"
        set srcintf "vlan40_hpc"
        set dstintf "port25"
        set srcaddr "NET_HPC_10_40_40_0_24"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH"
        set utm-status enable
        set ips-sensor "campus-edge-ips"
        set nat enable
        set logtraffic all
    next
    edit 999
        set name "EXPLICIT-DENY-CAMPUS-ALL"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
