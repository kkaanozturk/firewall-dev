# Path: 01-ankara-ofisi/configs/fg200f-rnd-isfw.conf
# Kalkan Bilişim - Ankara Savunma ve Kriptografi AR-GE İç Segmentasyon Güvenlik Duvarı (ISFW)
# Cihaz: Fortinet FortiGate 200F (Active-Passive HA) | Amaç: Çift Üreticili Savunma & Hava Boşluğuna Yakın İzolasyon

config system global
    set hostname "ANK-ISFW-01"
    set timezone 27
    set admin-sport 8443
    set admin-ssh-port 2222
    set admin-ssh-v1 disable
    set strong-crypto enable
    set ssl-min-proto-version TLSv1-2
end

config system ha
    set group-id 40
    set group-name "ANK-RND-ISFW-HA"
    set mode a-p
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set override disable
    set priority 200
end

config system interface
    edit "x1"
        set alias "TRANSIT_TO_PA1420"
        set ip 10.20.45.2 255.255.255.252
        set allowaccess ping
    next
    edit "x2"
        set alias "RND_DEFENSE_55_USERS"
        set ip 10.20.40.1 255.255.255.0
        set device-identification enable
    next
    edit "port1"
        set alias "MGMT_BASTION_VLAN10"
        set ip 10.20.10.21 255.255.255.0
        set allowaccess https ssh snmp
    next
end

config log syslogd setting
    set status enable
    set server "10.20.50.25"
    set mode reliable
    set port 6514
    set enc-algorithm high
end

config firewall address
    edit "NET_RND_DEFENSE"
        set subnet 10.20.40.0 255.255.255.0
    next
    edit "SRV_LOCAL_RODC_DNS"
        set subnet 10.20.50.10 255.255.255.255
    next
    edit "SRV_SIGNED_REPO_MIRROR"
        set subnet 10.20.50.30 255.255.255.255
    next
    edit "HOST_SECOPS_BASTION"
        set subnet 10.20.10.50 255.255.255.255
    next
end

config dlp sensor
    edit "DLP-DEFENSE-NO-EXFIL"
        set comment "Savunma AR-GE kod, şema ve FPGA bitstream dışarı çıkış engeli"
        config entries
            edit 1
                set type file
                set file-type 1
                set action block
            next
        end
    next
end

config firewall policy
    edit 101
        set name "ALLOW-RND-LOCAL-AD-NTP"
        set srcintf "x2"
        set dstintf "x1"
        set srcaddr "NET_RND_DEFENSE"
        set dstaddr "SRV_LOCAL_RODC_DNS"
        set action accept
        set schedule "always"
        set service "LDAPS" "KERBEROS" "DNS" "NTP"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next
    edit 102
        set name "ALLOW-RND-SIGNED-REPO"
        set srcintf "x2"
        set dstintf "x1"
        set srcaddr "NET_RND_DEFENSE"
        set dstaddr "SRV_SIGNED_REPO_MIRROR"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set av-profile "strict-av"
        set dlp-sensor "DLP-DEFENSE-NO-EXFIL"
        set ips-sensor "high_security"
        set logtraffic all
    next
    edit 103
        set name "ALLOW-BASTION-VDI-ADMIN"
        set srcintf "port1"
        set dstintf "x2"
        set srcaddr "HOST_SECOPS_BASTION"
        set dstaddr "NET_RND_DEFENSE"
        set action accept
        set schedule "always"
        set service "SSH"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next
    edit 199
        set name "EXPLICIT-DENY-RND-ALL"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

