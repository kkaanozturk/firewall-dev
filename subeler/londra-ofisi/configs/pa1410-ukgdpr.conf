# Path: subeler/londra-ofisi/configs/pa1410-ukgdpr.conf
# AegisNova Global - Londra EMEA Ofisi Sınır Güvenlik Duvarı Konfigürasyonu (UK-GDPR Uyumlu)
# Cihaz: Palo Alto Networks PA-1410 (Active-Passive HA) | WAN: 2x2 Gbps Leased Line (4.0 Gbps)

set deviceconfig system hostname LON-EMEA-FW01
set deviceconfig system domain uk.aegisnova.internal
set deviceconfig system ip-address 10.30.10.11 netmask 255.255.255.0 default-gateway 10.30.10.1
set deviceconfig system timezone Europe/London
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system permitted-ip 10.30.10.0/24
set deviceconfig system permitted-ip 10.10.10.0/24

# UK-GDPR Log Profili: Ham PII Yerel DPO Sunucusunda Kalır, İstanbul SOC'ye Maskeli Log Gider
set shared log-settings syslog LOCAL-DPO-AND-SIEM server LON-PSEUDONYMIZER-COLLECTOR transport SSL port 6514 format IETF server 10.30.50.25 facility LOG_LOCAL0

# HA Active-Passive
set deviceconfig high-availability enabled yes
set deviceconfig high-availability group 30 mode active-passive election-option device-priority 90 preemptive no
set deviceconfig high-availability group 30 state-synchronization enabled yes

# WAN (BTnet + Colt 2x2 Gbps) ve İç LACP (2x10G) VLAN Alt Arayüzleri
set network interface ethernet ethernet1/1 comment "ISP1-BTnet-2Gbps" layer3 ip 203.0.113.90/30
set network interface ethernet ethernet1/2 comment "ISP2-Colt-2Gbps" layer3 ip 198.51.100.90/30
set network interface aggregate-ethernet ae1 layer3 units ae1.10 tag 10 comment "IT_MGMT_15_Users" ip 10.30.10.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.20 tag 20 comment "CORP_STAFF_45_Users" ip 10.30.20.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.30 tag 30 comment "SW_CLOUD_50_Users" ip 10.30.30.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.40 tag 40 comment "RND_FINTECH_25_Users" ip 10.30.40.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.50 tag 50 comment "UK_GDPR_SRV_DataResidency" ip 10.30.50.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.60 tag 60 comment "DMZ_EMEA_GP_API" ip 10.30.60.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.70 tag 70 comment "VOICE_IOT" ip 10.30.70.1/24
set network interface aggregate-ethernet ae1 layer3 units ae1.90 tag 90 comment "GUEST_WIFI" ip 172.16.30.1/24

set network interface tunnel units tunnel.10 comment "IPsec-to-Istanbul-HQ" ip 172.31.250.6/30
set network interface tunnel units tunnel.99 comment "IPsec-to-AWS-eu-west-2-London" ip 169.254.210.2/30

# Güvenlik Bölgeleri
set zone UNTRUST_WAN network layer3 [ ethernet1/1 ethernet1/2 ]
set zone VPN_HQ network layer3 tunnel.10
set zone VPN_AWS_LON network layer3 tunnel.99
set zone IT_MGMT network layer3 ae1.10
set zone CORP_STAFF network layer3 ae1.20
set zone SW_CLOUD network layer3 ae1.30
set zone RND_FINTECH network layer3 ae1.40
set zone UK_GDPR_SRV network layer3 ae1.50
set zone DMZ_EMEA network layer3 ae1.60
set zone VOICE_IOT network layer3 ae1.70
set zone GUEST_WIFI network layer3 ae1.90

# Londra UK-GDPR ve Cloud-Native Güvenlik Kuralları
set rulebase security rules BLK-THREAT-NCSC-EDL from UNTRUST_WAN to any source [ EDL-UK-NCSC-MALICIOUS EDL-TOR-EXIT-NODES ] destination any application any service any action drop log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-IPSEC-HQ-AWS from UNTRUST_WAN to UNTRUST_WAN source [ 198.51.100.2 52.56.10.20 ] destination 203.0.113.90 application [ ike ipsec-esp-udp ] service application-default action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules DENY-UKGDPR-CROSSBORDER-DB from UK_GDPR_SRV to [ VPN_HQ UNTRUST_WAN ] source 10.30.50.0/24 destination any application [ postgresql mysql mssql-db oracle smb ftp rsync ] service any action deny log-start yes log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-PSEUDONYMIZED-SIEM from UK_GDPR_SRV to VPN_HQ source 10.30.50.25 destination 10.10.50.25 application syslog service TCP-6514-TLS profile-setting group PG-STRICT-IPS action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-SWCLOUD-TO-AWS-UK from SW_CLOUD to VPN_AWS_LON source 10.30.30.0/24 source-user "AEGISNOVA\\GRP_UK_CloudEng" destination 172.28.0.0/16 application [ ssh ssl kubernetes ] service application-default profile-setting group PG-CLOUD-DLP-SECRETS action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-SWCLOUD-HQ-GIT from SW_CLOUD to VPN_HQ source 10.30.30.0/24 source-user "AEGISNOVA\\GRP_UK_CloudEng" destination 10.10.50.40 application [ git ssh ssl ] service application-default profile-setting group PG-STRICT-IPS action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-FINTECH-RND-SANDBOX from RND_FINTECH to UNTRUST_WAN source 10.30.40.0/24 source-user "AEGISNOVA\\GRP_UK_FinTech_RnD" destination FQDN-UK-OPENBANKING-SANDBOX application ssl service service-https profile-setting group PG-UKGDPR-DLP action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules DENY-RND-UNAPPROVED-WAN from RND_FINTECH to [ UNTRUST_WAN CORP_STAFF GUEST_WIFI ] source 10.30.40.0/24 destination any application any service any action deny log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-CORP-SAAS-DLP from CORP_STAFF to UNTRUST_WAN source 10.30.20.0/24 source-user "AEGISNOVA\\GRP_UK_Staff" destination any application [ ms-office365 salesforce zoom web-browsing ssl ] service application-default profile-setting group PG-UKGDPR-DLP action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-GLOBALPROTECT-ZTNA from UNTRUST_WAN to DMZ_EMEA source any destination 10.30.60.15 application [ pan-os-global-protect ssl ] service service-https profile-setting group PG-STRICT-IPS action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules ALLOW-GUEST-WIFI-UK from GUEST_WIFI to UNTRUST_WAN source 172.16.30.0/24 destination any application [ web-browsing ssl dns ] service application-default action allow log-end yes log-setting LOCAL-DPO-AND-SIEM
set rulebase security rules EXPLICIT-DENY-ALL-LOG from any to any source any destination any application any service any action drop log-end yes log-setting LOCAL-DPO-AND-SIEM

