# Path: lab/docker-compose.lab.yml
# AegisNova Global - Çok Şubeli Gerçek Alt Ağ ve Linux nftables + tc QoS Konteyner Laboratuvarı
# Başlatma: docker compose -f lab/docker-compose.lab.yml up -d --build
# Otomatik Test: bash lab/scripts/run-lab-tests.sh

services:
  # ==================== ORTAK DIŞ İNTERNET / WAN HEDEFİ ====================
  wan-internet-target:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-wan-target
    command: ["sh", "-c", "python3 -m http.server 443 & nc -lk -p 6514 & nc -lk -p 6881 & wait"]
    networks:
      wan_backbone:
        ipv4_address: 198.51.100.200

  # ==================== 1. İSTANBUL OFİSİ (HQ) ====================
  ist-hq-fw:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-ist-hq-fw
    cap_add: ["NET_ADMIN"]
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/opt/aegisnova/scripts/init-fw-node.sh", "istanbul-fw"]
    networks:
      wan_backbone:
        ipv4_address: 198.51.100.10
      ist_swdev_net:
        ipv4_address: 10.10.30.254
      ist_dc_net:
        ipv4_address: 10.10.50.254

  ist-gitlab-srv:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-ist-gitlab
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.10.50.254 && python3 -m http.server 443"]
    depends_on: [ist-hq-fw]
    networks:
      ist_dc_net:
        ipv4_address: 10.10.50.40

  ist-swdev-client:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-ist-swdev-client
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.10.30.254 && sleep infinity"]
    depends_on: [ist-hq-fw]
    networks:
      ist_swdev_net:
        ipv4_address: 10.10.30.25

  # ==================== 2. ANKARA OFİSİ (SAVUNMA AR-GE ISFW) ====================
  ank-isfw:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-ank-isfw
    cap_add: ["NET_ADMIN"]
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/opt/aegisnova/scripts/init-fw-node.sh", "ankara-isfw"]
    networks:
      wan_backbone:
        ipv4_address: 198.51.100.20
      ank_rnd_net:
        ipv4_address: 10.20.40.254
      ank_srv_net:
        ipv4_address: 10.20.50.254

  ank-repo-mirror:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-ank-repo-mirror
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.20.50.254 && python3 -m http.server 443"]
    depends_on: [ank-isfw]
    networks:
      ank_srv_net:
        ipv4_address: 10.20.50.30

  ank-rnd-workstation:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-ank-rnd-pc
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.20.40.254 && sleep infinity"]
    depends_on: [ank-isfw]
    networks:
      ank_rnd_net:
        ipv4_address: 10.20.40.12

  # ==================== 3. LONDRA OFİSİ (UK-GDPR VERİ YERLEŞİMİ) ====================
  lon-emea-fw:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-lon-emea-fw
    cap_add: ["NET_ADMIN"]
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/opt/aegisnova/scripts/init-fw-node.sh", "londra-fw"]
    networks:
      wan_backbone:
        ipv4_address: 198.51.100.30
      lon_gdpr_net:
        ipv4_address: 10.30.50.254

  lon-gdpr-db:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-lon-gdpr-srv
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.30.50.254 && sleep infinity"]
    depends_on: [lon-emea-fw]
    networks:
      lon_gdpr_net:
        ipv4_address: 10.30.50.14

  # ==================== 4. AKADEMİK ŞUBE (10.000 ÖĞRENCİ & SINAV AĞI) ====================
  aka-campus-fw:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-aka-campus-fw
    cap_add: ["NET_ADMIN"]
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["/opt/aegisnova/scripts/init-fw-node.sh", "akademik-fw"]
    networks:
      wan_backbone:
        ipv4_address: 198.51.100.40
      aka_student_wifi:
        ipv4_address: 10.100.0.254
      aka_exam_net:
        ipv4_address: 10.40.55.254
      aka_dmz_edu:
        ipv4_address: 10.40.60.254
      aka_campus_dc:
        ipv4_address: 10.40.50.254

  aka-exam-lms:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-aka-exam-lms
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.40.60.254 && python3 -m http.server 443"]
    depends_on: [aka-campus-fw]
    networks:
      aka_dmz_edu:
        ipv4_address: 10.40.60.50

  aka-obs-db:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-aka-obs-db
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.40.50.254 && nc -lk -p 5432"]
    depends_on: [aka-campus-fw]
    networks:
      aka_campus_dc:
        ipv4_address: 10.40.50.10

  aka-student-client:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-aka-student-pc
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.100.0.254 && sleep infinity"]
    depends_on: [aka-campus-fw]
    networks:
      aka_student_wifi:
        ipv4_address: 10.100.42.19

  aka-exam-pc:
    build:
      context: ..
      dockerfile: lab/Dockerfile.ngfw
    container_name: lab-aka-exam-pc
    cap_add: ["NET_ADMIN"]
    command: ["sh", "-c", "ip route replace default via 10.40.55.254 && sleep infinity"]
    depends_on: [aka-campus-fw]
    networks:
      aka_exam_net:
        ipv4_address: 10.40.55.101

networks:
  wan_backbone:
    ipam:
      config: [{ subnet: 198.51.100.0/24 }]
  ist_swdev_net:
    ipam:
      config: [{ subnet: 10.10.30.0/24 }]
  ist_dc_net:
    ipam:
      config: [{ subnet: 10.10.50.0/24 }]
  ank_rnd_net:
    ipam:
      config: [{ subnet: 10.20.40.0/24 }]
  ank_srv_net:
    ipam:
      config: [{ subnet: 10.20.50.0/24 }]
  lon_gdpr_net:
    ipam:
      config: [{ subnet: 10.30.50.0/24 }]
  aka_student_wifi:
    ipam:
      config: [{ subnet: 10.100.0.0/16 }]
  aka_exam_net:
    ipam:
      config: [{ subnet: 10.40.55.0/24 }]
  aka_dmz_edu:
    ipam:
      config: [{ subnet: 10.40.60.0/24 }]
  aka_campus_dc:
    ipam:
      config: [{ subnet: 10.40.50.0/24 }]

