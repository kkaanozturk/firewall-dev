      <text x="12" y="38" fill="#cbd5e1" font-size="11">135 Kişi • WAN: 4.0 Gbps</text>
      <text x="12" y="54" fill="#34d399" font-size="10.5" font-weight="600">● UK-GDPR KILIDI AKTIF</text>
