    <text x="0" y="166" fill="#f87171" class="line l7">05. [DENY]  LON-PA1410-HA   | 10.30.50.14 (UK-GDPR)  -&gt; 10.10.50.80:5432 (PostgreSQL TR)  [Rule: DENY-UKGDPR-CROSSBORDER]</text>

    <text x="0" y="190" fill="#34d399" class="line l8">06. [ALLOW] AKA-FG1800F-HA  | 10.100.42.19 (Ogrenci) -&gt; 193.140.100.10:443 (Eduroam 8M)   [Rule: ALLOW-10K-STUDENTS-5651]</text>

    <text x="0" y="214" fill="#f87171" class="line l9">07. [DROP]  AKA-FG1800F-HA  | 10.100.12.77 (Ogrenci) -&gt; 42.0 Mbps (&gt;15 Mbps Per-IP Tavan) [Rule: QOS-SHAPER-15M-400SES]</text>

