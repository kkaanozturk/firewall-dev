    <text x="0" y="44" fill="#94a3b8" class="line l2">[PASS] TestEnterpriseHeadcountAndBandwidthPlan (11.425 Kisi | 10.000 Ogrenci | 47.5 Gbps Toplam WAN)</text>

    <text x="0" y="70" fill="#34d399" class="line l3">01. [ALLOW] IST-HQ-PA3430   | 10.10.30.25 (Yazilim)  -&gt; 10.10.50.40:443 (GitLab CI/CD)    [Rule: ALLOW-SWDEV-CICD-GIT]</text>

