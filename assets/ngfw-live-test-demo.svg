<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%">
  <!-- Path: assets/ngfw-live-test-demo.svg -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .line { opacity: 0; animation: cycleFade 16s infinite; }
      .l1  { animation-delay: 0.4s; }
      .l2  { animation-delay: 1.2s; }
      .l3  { animation-delay: 2.0s; }
      .l4  { animation-delay: 2.9s; }
      .l5  { animation-delay: 3.8s; }
      .l6  { animation-delay: 4.7s; }
      .l7  { animation-delay: 5.6s; }
      .l8  { animation-delay: 6.5s; }
      .l9  { animation-delay: 7.4s; }
      .l10 { animation-delay: 8.4s; }
      .l11 { animation-delay: 9.5s; }
      .l12 { animation-delay: 10.7s; }
      .l13 { animation-delay: 11.9s; }

      .pulse { animation: pulseAnim 2s infinite; }
      .progress { animation: progBar 16s infinite linear; }

      @keyframes cycleFade {
        0%, 4%   { opacity: 0; transform: translateY(4px); }
        7%, 90%  { opacity: 1; transform: translateY(0); }
        96%, 100%{ opacity: 0; }
      }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
      @keyframes progBar {
        0%   { width: 0px; }
        88%  { width: 920px; }
        100% { width: 920px; }
      }
    </style>
  </defs>

