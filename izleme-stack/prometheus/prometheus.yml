# Path: izleme-stack/prometheus/prometheus.yml
# AegisNova Global - Tüm Şube Güvenlik Duvarları ve 5651 Log Sunucuları Telemetri Konfigürasyonu

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    organization: "aegisnova-global"
    soc_region: "istanbul-hq"

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # Go NGFW Simülasyon ve Canlı Telemetri Sunucusu (cmd/aegisnova-sim --serve-metrics)
  - job_name: "aegisnova-ngfw-engine"
    static_configs:
      - targets: ["host.docker.internal:9115"]
        labels:
          tier: "simulation-and-exporter"

  # Kurumsal Sınır Güvenlik Duvarları (SNMPv3 / PanOS Exporter)
  - job_name: "panos-perimeter-firewalls"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.10.11:9116"]
        labels:
          branch: "istanbul-ofisi"
          model: "PA-3430"
          wan_gbps: "10.0"
      - targets: ["10.20.10.11:9116"]
        labels:
          branch: "ankara-ofisi"
          model: "PA-1420"
          wan_gbps: "3.5"
      - targets: ["10.30.10.11:9116"]
        labels:
          branch: "londra-ofisi"
          model: "PA-1410"
          wan_gbps: "4.0"

  # Kampüs Omurgası ve Ankara Savunma AR-GE ISFW (FortiGate Exporter)
  - job_name: "fortigate-campus-and-isfw"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.40.10.1:9710"]
        labels:
          branch: "akademik-sube"
          model: "FG-1800F"
          wan_gbps: "30.0"
          students: "10000"
      - targets: ["10.20.10.21:9710"]
        labels:
          branch: "ankara-ofisi-rnd-isfw"
          model: "FG-200F"
          zone: "RND_DEFENSE"

