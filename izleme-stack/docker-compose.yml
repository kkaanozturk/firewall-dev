# Path: izleme-stack/docker-compose.yml
# AegisNova Global - 7/24 Merkez SOC & NOC İzleme Altyapısı (Prometheus + Grafana + Alertmanager + Loki)
# Çalıştırma: cd izleme-stack && docker compose up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aegisnova-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aegisnova-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:3.1.1
    container_name: aegisnova-loki-siem
    restart: unless-stopped
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aegisnova-soc-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=soc_admin
      - GF_SECURITY_ADMIN_PASSWORD=AegisNova_SOC_2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/ngfw-soc-dashboard.json:/var/lib/grafana/dashboards/ngfw-soc-dashboard.json:ro
    depends_on:
      - prometheus
      - loki

